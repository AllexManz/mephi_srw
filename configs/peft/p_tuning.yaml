# P-tuning prompt encoder configuration. Prompt embeddings avoid the legacy
# tuple KV-cache incompatibility present in recent Transformers models.
peft:
  enabled: true
  method: p_tuning
  adapter_path: null
  init_adapter_path: null
  common:
    task_type: CAUSAL_LM
    inference_mode: false
  prompt_encoder:
    num_virtual_tokens: 20
    encoder_hidden_size: null
    encoder_num_layers: 2
    encoder_dropout: 0.0
