# Base PEFT configuration
peft:
  enabled: false
  method: lora
  adapter_path: null

  # Common PEFT settings
  common:
    task_type: CAUSAL_LM
    inference_mode: false

  # LoRA specific settings
  lora:
    r: 8
    alpha: 16
    lora_dropout: 0.1
    bias: none
    modules_to_save: null
    target_modules: []  # To be overridden by model-specific configs 

  # Prefix Tuning settings
  prefix_tuning:
    num_virtual_tokens: 20
    encoder_hidden_size: 768
    prefix_projection: true

  # Prompt Tuning settings
  prompt_tuning:
    num_virtual_tokens: 20
    prompt_tuning_init: TEXT
    token_dim: 768
    prompt_tuning_init_text: ""