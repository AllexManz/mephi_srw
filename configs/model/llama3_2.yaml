defaults:
  - base

# Llama-3.2-3B-Instruct model configuration (released late 2024, highly relevant in 2026)
model:
  id: llama3_2
  name: meta-llama/Llama-3.2-3B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  use_cache: false
  load_in_8bit: false
  load_in_4bit: false
  # Model-specific training settings
  training:
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 8
    learning_rate: 1e-4
    max_length: 512
