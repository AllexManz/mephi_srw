defaults:
  - base

# Gemma-2-2b-it model configuration (Google's highly efficient 2B model, highly relevant in 2026)
model:
  id: gemma2
  name: google/gemma-2-2b-it
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  use_cache: false
  load_in_8bit: false
  load_in_4bit: false
  # Model-specific training settings
  training:
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 8
    learning_rate: 1e-4
    max_length: 512
