services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    secrets:
      - minio_root_user
      - minio_root_password
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"
        exec minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    depends_on:
      - minio
    secrets:
      - minio_root_user
      - minio_root_password
    ports:
      - "5000:5000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export MLFLOW_S3_ENDPOINT_URL=http://minio:9000
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/minio_root_user)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_root_password)"
        exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --artifacts-destination s3://mlflow --serve-artifacts

  minio-init:
    image: minio/mc:RELEASE.2024-06-13T22-53-53Z
    depends_on:
      - minio
    secrets:
      - minio_root_user
      - minio_root_password
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$(cat /run/secrets/minio_root_user)" "$$(cat /run/secrets/minio_root_password)"
        mc mb -p local/mlflow || true

volumes:
  minio_data:

secrets:
  minio_root_user:
    file: .secrets/minio_root_user
  minio_root_password:
    file: .secrets/minio_root_password
